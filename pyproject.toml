[project]
name = "BackendProject"
version = "0.1.0"
description = ""
authors = [
    {name = "Igor",email = "okallizn@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.0,<0.150.0",
    "uvicorn[standard]>=0.51.0,<0.52.0",
    "SQLAlchemy>=2.0.51,<3.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "redis>=8.0.1,<9.0.0",
    "celery>=5.6.3,<6.0.0",
    "kafka-python (>=3.0.9,<4.0.0)",
    "httpx>=0.28.0,<0.29.0",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "kubernetes (>=36.0.3,<37.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest-mock (>=3.15.1,<4.0.0)"
]
