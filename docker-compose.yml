
services:
  app:
    build: .
    container_name: livros-api
    ports:
        - "8000:8000"
    volumes:
        - .:/app
    env_file:
        - .env
    command: ["poetry", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
     replicas: 1
     restart_policy:
       condition: on-failure